# Builds the launcher for every desktop host, tests it, packages it
# (profiles/sarusaru/scripts/package.py; on Linux also as an AppImage, and as a
# Flatpak with profiles/sarusaru/packaging/linux/build_flatpak.sh) and, for a
# version tag, attaches the packages to a draft GitHub release to review and
# publish by hand.
#
# The packages contain no game code: the launcher builds the game on each
# player's machine from their own disc. Windows is built with the same pinned
# llvm-mingw that players' launchers download, so the two match.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version
        id: version
        shell: bash
        run: |
          version="$(cat profiles/sarusaru/VERSION)"
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="$GITHUB_REF_NAME"; fi
          version="$(python3 profiles/sarusaru/scripts/release_metadata.py "$version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  package:
    name: ${{ matrix.host }}
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: windows-x64
            runner: windows-2022
          # The oldest supported Ubuntu, so the packages run on as many
          # distributions (glibc versions) as possible.
          - host: linux-x64
            runner: ubuntu-22.04
          - host: linux-arm64
            runner: ubuntu-22.04-arm
          - host: macos-arm64
            runner: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-12 ninja-build pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxfixes-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols libdecor-0-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libudev-dev libdbus-1-dev libdrm-dev libgbm-dev libegl-dev
          echo "CC=gcc-12" >> "$GITHUB_ENV"
          echo "CXX=g++-12" >> "$GITHUB_ENV"

      - name: Install macOS packages
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Fetch llvm-mingw
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cmake -DHOST=windows "-DDEST=$RUNNER_TEMP" -P profiles/sarusaru/cmake/fetch_llvm_mingw.cmake
          # Test programs built outside bin/ (the framework's import tests) find its C++ runtime here.
          echo "$RUNNER_TEMP/llvm-mingw/x86_64-w64-mingw32/bin" >> "$GITHUB_PATH"

      - name: Configure
        shell: bash
        run: |
          extra=()
          case "${{ runner.os }}" in
            Windows) extra+=("-DCMAKE_TOOLCHAIN_FILE=profiles/sarusaru/cmake/llvm-mingw.toolchain.cmake"
                             "-DLLVM_MINGW_ROOT=$RUNNER_TEMP/llvm-mingw") ;;
            macOS) extra+=(-DCMAKE_OSX_ARCHITECTURES=arm64 "-DCMAKE_OSX_DEPLOYMENT_TARGET=$MACOSX_DEPLOYMENT_TARGET") ;;
          esac
          cmake -S . -B out/${{ matrix.host }} -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPSPRECOMP_PROFILE=sarusaru -DSARUSARU_GAME_MODULE=OFF \
            -DSARUSARU_RELEASE_VERSION=${{ needs.version.outputs.version }} "${extra[@]}"

      - name: Build
        run: cmake --build out/${{ matrix.host }} --parallel 4

      - name: Test
        run: ctest --test-dir out/${{ matrix.host }} --output-on-failure

      - name: Package
        shell: bash
        run: |
          version="v${{ needs.version.outputs.version }}"
          python3 profiles/sarusaru/scripts/package.py --build out/${{ matrix.host }} \
            --host ${{ matrix.host }} --version "$version" --out out/dist
          if [ "${{ runner.os }}" = Linux ]; then
            python3 profiles/sarusaru/scripts/package.py --build out/${{ matrix.host }} \
              --host ${{ matrix.host }} --version "$version" --out out/dist --format appimage
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.host }}
          path: out/dist/*
          if-no-files-found: error

  # The Flatpak builds from source inside the Freedesktop SDK, so it has its
  # own job, in a container that can run flatpak-builder.
  flatpak:
    name: ${{ matrix.host }} flatpak
    needs: version
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux-x64
            runner: ubuntu-24.04
          - host: linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build the Flatpak
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          version="v${{ needs.version.outputs.version }}"
          profiles/sarusaru/packaging/linux/build_flatpak.sh "$version" out/dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.host }}-flatpak
          path: out/dist/*
          if-no-files-found: error

  android:
    name: android-arm64 release APK
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      SARUSARU_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      SARUSARU_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      SARUSARU_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$SARUSARU_ANDROID_STORE_PASSWORD" && test -n "$SARUSARU_ANDROID_KEY_ALIAS" && test -n "$SARUSARU_ANDROID_KEY_PASSWORD" || {
            echo "Configure the four Android release signing secrets documented in profiles/sarusaru/docs/auto-updates.md"; exit 1;
          }
          umask 077
          keystore="$RUNNER_TEMP/sarusaru-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          echo "SARUSARU_ANDROID_KEYSTORE=$keystore" >> "$GITHUB_ENV"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build glslang-tools make patch
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
            "platforms;android-36" "ndk;29.0.14206865" "cmake;4.1.2" "build-tools;36.0.0"
      # Built on main by android-toolchain.yml: a tag's run can restore the
      # default branch's caches, never another tag's.
      - name: Cache staged Android compiler
        id: compiler
        uses: actions/cache@v4
        with:
          path: out/android-toolchain/stage
          key: android-compiler-${{ hashFiles('profiles/sarusaru/packaging/android/toolchain/build_toolchain.py') }}
      - name: Build the on-device compiler
        if: steps.compiler.outputs.cache-hit != 'true'
        run: python3 profiles/sarusaru/packaging/android/toolchain/build_toolchain.py --jobs 4
      - name: Build signed APK
        working-directory: profiles/sarusaru/packaging/android
        run: ./gradlew assembleRelease -PreleaseVersion=${{ needs.version.outputs.version }}
      - name: Verify and package APK
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          apk=profiles/sarusaru/packaging/android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          python3 profiles/sarusaru/scripts/check_android_apk.py "$apk"
          analyzer="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          test "$("$analyzer" manifest version-name "$apk")" = "$VERSION"
          test "$("$analyzer" manifest version-code "$apk")" = "$(python3 profiles/sarusaru/scripts/release_metadata.py "$VERSION" --android-code)"
          mkdir -p out/dist
          cp "$apk" "out/dist/SaruSaruRecomp-v$VERSION-android-arm64.apk"
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/sarusaru-release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64-release
          path: out/dist/*.apk
          if-no-files-found: error

  release:
    name: Draft release
    if: github.ref_type == 'tag'
    needs: [version, package, flatpak, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 profiles/sarusaru/scripts/release_metadata.py "$GITHUB_REF_NAME" --assets dist
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat > notes.md <<'EOF'
          Launcher packages for Windows x64, Linux x64 and arm64, macOS arm64, and Android arm64.
          Android: install the signed APK and add this repository to Obtainium for updates.
          Linux has three: a .tar.gz, an AppImage, and a .flatpak bundle
          (`flatpak install --user <file>.flatpak`; it brings its own compiler).

          They contain no game files or game code. Choose your own disc image
          (.iso) of the Japanese UMD (UCJS10060) in the launcher; the first
          time you play, it builds the game for your computer from that disc.
          See README.txt in each package for what that needs.
          EOF
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
            --title "SaruSaru Recomp $GITHUB_REF_NAME" --notes-file notes.md \
            ./*.zip ./*.tar.gz ./*.AppImage ./*.flatpak ./*.apk update-info.txt SHA256SUMS.txt
