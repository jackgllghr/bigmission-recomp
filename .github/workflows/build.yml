# Builds the framework and the SaruSaru profile (with its launcher) on every
# target desktop host and runs their tests, and builds the Android launcher
# APK. No game files exist here, so the game module (code generated from the
# player's own disc) is not built.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.host }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: windows-x64
            runner: windows-2022
          - host: linux-x64
            runner: ubuntu-24.04
          - host: linux-arm64
            runner: ubuntu-24.04-arm
          - host: macos-arm64
            runner: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxfixes-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols libdecor-0-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libudev-dev libdbus-1-dev libdrm-dev libgbm-dev libegl-dev

      - name: Install macOS packages
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: bash
        run: |
          extra=()
          if [ "${{ runner.os }}" = macOS ]; then extra+=(-DCMAKE_OSX_ARCHITECTURES=arm64); fi
          cmake -S . -B out/${{ matrix.host }} -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPSPRECOMP_PROFILE=sarusaru -DSARUSARU_GAME_MODULE=OFF "${extra[@]}"

      - name: Build
        run: cmake --build out/${{ matrix.host }} --parallel 4

      - name: Test
        run: ctest --test-dir out/${{ matrix.host }} --output-on-failure

      # A download per host: the PSPRecomp tools and the runtime the game is
      # built against (SDL3, FFmpeg, MoltenVK on macOS, fonts, licences). The
      # game itself is not here: it is compiled from the player's own disc.
      - name: Package
        shell: bash
        run: |
          build=out/${{ matrix.host }}
          package=out/package/sarusaru-${{ matrix.host }}
          mkdir -p "$package"
          cp -R "$build/bin/." "$package/"
          rm -f "$package"/*_tests "$package"/*_tests.exe
          # Never publish game-derived code, even if a build here produced it.
          rm -f "$package"/sarusaru "$package"/sarusaru.exe "$package"/sarusaru_bootstrap "$package"/sarusaru_bootstrap.exe
          # The framework's tools (psp_analyze, psp_recomp, dump_function) are in bin/ too.
          for tool in psp_analyze psp_recomp dump_function; do
            ls "$package/$tool"* >/dev/null
          done
          cp LICENSE "$package/LICENSE.txt"
          cp profiles/sarusaru/THIRD_PARTY.md "$package/"
          if [ "${{ runner.os }}" != Windows ]; then
            # A tarball keeps the executable bits and library symlinks that
            # the artifact's zip would drop.
            tar -C out/package -czf "out/package/sarusaru-${{ matrix.host }}.tar.gz" "sarusaru-${{ matrix.host }}"
            rm -rf "$package"
          fi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: sarusaru-${{ matrix.host }}
          path: out/package/
          if-no-files-found: error
          # Artifacts count against the account's Actions storage.
          retention-days: 14

  # The Android launcher APK (profiles/sarusaru/packaging/android/README.md).
  # Like the desktop packages, it holds the launcher, never the game.
  android:
    name: android-arm64
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: profiles/sarusaru/packaging/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The Gradle distribution and dependencies, cached between runs.
      - uses: gradle/actions/setup-gradle@v4

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends glslang-tools make

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
            "platforms;android-36" "ndk;29.0.14206865" "cmake;4.1.2"

      # The FFmpeg archive and its cross-compiled build, which CMake reuses
      # while its stamp (version, hash, NDK paths, flags) matches.
      - name: Cache FFmpeg
        uses: actions/cache@v4
        with:
          path: |
            profiles/sarusaru/packaging/android/app/.cxx/Debug/*/arm64-v8a/_deps/downloads
            profiles/sarusaru/packaging/android/app/.cxx/Debug/*/arm64-v8a/_deps/ffmpeg/install
          key: android-ffmpeg-${{ hashFiles('profiles/sarusaru/cmake/FFmpeg.cmake', 'profiles/sarusaru/packaging/android/app/build.gradle.kts') }}

      - name: Build
        run: ./gradlew assembleDebug

      # Never publish game-derived code: only the launcher's own libraries
      # and the shipped resources may be in the APK.
      - name: Check contents
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          python3 ../../scripts/check_android_apk.py "$apk" --allow-missing-compiler
          mkdir -p ../../../../out/package
          cp "$apk" ../../../../out/package/sarusaru-android-arm64-debug.apk

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: sarusaru-android-arm64
          path: out/package/
          if-no-files-found: error
          retention-days: 14
