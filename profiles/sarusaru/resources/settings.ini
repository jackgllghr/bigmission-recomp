# SaruSaru settings. Restart the game after editing.
# Keyboard values: SDL physical key names or scancode:N; comma separates alternatives.
# Gamepad values: SDL button names, two held together as a+b, or axis:NAME+ / axis:NAME-; none unbinds.
[graphics]
# Rendering scale: 1-8 times the PSP's 480x272.
internal_resolution = 4
# Cel shading: 0 = off, 1 = banded, 2 = banded with black world and character outlines.
cel_shading = 0
# Window size at startup, in points; the window stays resizable and the picture keeps its aspect.
window_width = 960
window_height = 544
# 1 = fullscreen at the desktop resolution (Alt+Enter or F11 toggles while playing).
fullscreen = 0
# 0 = native; 30 = capped at 30; 60 = 60 FPS motion at native game speed, an interpolated
# picture between game frames (adds one vblank of latency).
frame_rate = 60
# Gameplay camera vertical FOV: 0 = native (about 36.5); 30-120. Menus, cutscenes and HUD stay native.
fov_degrees = 0
# HD texture pack directory, relative to this settings file, or none for the original textures.
texture_pack = none

[translation]
# ja = original; en = English menu pack. Restart to change languages.
language = ja
# Pack path relative to this settings file, or none.
pack = none

[input]
dead_zone = 0.2

[game]
# The disc image (.iso) the launcher plays; empty until one is chosen. % and # are written as %XX.
disc = 
# 1 = skip the opening logos. Start also skips them with this off.
skip_intro_logos = 0
# State slot used by save/load shortcuts (1-5).
state_slot = 1

[interface]
# The gamepad button that confirms in the launcher: south (cross) or east (circle, as in the game).
confirm = south
# The launcher's language: auto (the system's), en or ja. The game's own text stays Japanese.
language = auto

[keyboard]
up = Up
down = Down
left = Left
right = Right
circle = Z
cross = X
square = A
triangle = S
l = Q
r = W
start = Return
select = Backspace
analog_left = J
analog_right = L
analog_up = I
analog_down = K
fast_forward = Tab
menu = Escape
camera_left = Keypad 4
camera_right = Keypad 6
camera_up = Keypad 8
camera_down = Keypad 2
camera_reset = Keypad 5
# The selected persistent state slot; F5 saves and F8 loads.
save_state = F5
load_state = F8

[gamepad]
up = dpup
down = dpdown
left = dpleft
right = dpright
circle = b
cross = a
square = x
triangle = y
l = leftshoulder, axis:lefttrigger+
r = rightshoulder, axis:righttrigger+
start = start
select = back
analog_left = axis:leftx-
analog_right = axis:leftx+
analog_up = axis:lefty-
analog_down = axis:lefty+
fast_forward = none
menu = guide, leftstick+rightstick
camera_left = axis:rightx-
camera_right = axis:rightx+
camera_up = axis:righty+
camera_down = axis:righty-
camera_reset = rightstick
save_state = back+rightshoulder
load_state = back+leftshoulder
