# SaruSaru settings. Restart the game after editing.
# Keyboard values: SDL physical key names or scancode:N; comma separates alternatives.
# Gamepad values: SDL button names or axis:NAME+ / axis:NAME-; none unbinds.
[graphics]
internal_resolution = 2
# Presentation cap only: 0 = native; 1-60. Simulation speed is unchanged.
frame_rate = 0
# Reserved camera preference: 0 = native. Nonzero values currently warn and have no effect.
fov_degrees = 0

[input]
dead_zone = 0.2

[keyboard]
up = Up
down = Down
left = Left
right = Right
circle = Z
cross = X
square = A
triangle = S
l = Q
r = W
start = Return
select = Backspace
analog_left = J
analog_right = L
analog_up = I
analog_down = K
fast_forward = Tab
quit = Escape

[gamepad]
up = dpup
down = dpdown
left = dpleft
right = dpright
circle = b
cross = a
square = x
triangle = y
l = leftshoulder, axis:lefttrigger+
r = rightshoulder, axis:righttrigger+
start = start
select = back
analog_left = axis:leftx-
analog_right = axis:leftx+
analog_up = axis:lefty-
analog_down = axis:lefty+
fast_forward = none
quit = none
